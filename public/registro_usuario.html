<!DOCTYPE html>
<html>
<head>
    <link href="style.css" rel="Stylesheet">
    <meta charset="UTF-8">
    <title>Registro Corralon Gomez</title>
</head>
<body>
    <form class="container" method="post" action="">
        <h1>Completa el formulario de registro!</h1>
        <label for="enter-name">Ingresa tu/s nombre/s:</label>
        <input type="text" class="input" id="enter-name" placeholder="nombre...">
        
        <label for="enter-username">Ingresa tu apellido:</label>
        <input type="text" class="input" id="enter-username" placeholder="apellido...">

        <label for="enter-email">Ingresa tu email:</label>
        <input type="text" class="input" id="enter-email" placeholder="email...">

        <label for="enter-password">Ingresa tu nueva contraseña:</label>
        <input type="text" class="input" id="enter-password" placeholder="contraseña...">

        <label for="enter-password">Confirma la contraseña</label>
        <input type="password" class="input" id="enter-new-password" placeholder="confirmala...">
        <button class="btn" type="submit">Registrame!</button>
    </form>

    <script src="registro_javascript.js"></script>

</body>
</html>
