<!DOCTYPE html>
<html lang="en">
<head>
    <title>Subir Producto</title>
</head>
<body>

    <article class="container">
        <h2>Complete los Campos</h2>
        <form action="http://localhost:3000/images/single" enctype="multipart/form-data" 
              method="post" >
            
            <!--Imagen-->
            <label>Seleccione una Imagen para el Producto (archivo):</label>
            <input type="file" name="imagen"><br>

            <!--Descripcion-->
            <label for="descripcion_producto">Describa al producto: </label>
            <input type="text" id="descripcion_producto" name="descripcion" placeholder="nombre, marca....">

            <!--Categoria-->
            <label for="categoria">Indique la categoria</label>
            <select id="categoria" name="categoria">
                <option value="materiales">Materiales</option> 
                <option value="sanitarios">Sanitarios</option>
                <option value="herramientas">Herramientas</option> 
            </select>

            <!--Precio-->
            <label for="precio_producto">Indique su Precio</label>
            <input type="number" id="precio_producto" name="precio" placeholder="$1XXX">

            <button type="submit" id="btn_subir">Subir Producto!</button>
            
            
        </form>
    </article>
    
</body>
</html>
