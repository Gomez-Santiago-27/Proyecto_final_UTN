<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Casa Gomez</title>
</head>
<body>
    <article class="container">

        <section class="logo">
            <img src="img/logo_2.png" alt="" height="80" width="100">
        </section>
            
        <section id="eslogan"> 
            <h3>Admin</h3>
        </section>

        <section class="buscador-productos">
            <input type="text" class="input" id="search-main" placeholder="Busca o Elige un filtro...">
            
            <select id="select_filter">
                <option value="Mostrar todo">Mostrar todo</option>
                <option value="Mas recientes">Mas recientes</option>
                <option value="Mas antigüos">Mas antigüos</option>
                <option value="Materiales">Materiales</option>
                <option value="Herramientas">Herramientas</option>
                <option value="Sanitarios">Sanitarios</option>
            </select>

            <button type="button" class="btn" id="btn_filter"> Filtrar </button>

            <button type="button" class="btn" id="btn_filter" onclick="window.location.href='subir_producto.html'">
                Agregar Producto
            </button>
        </section>

        <section class="contenedor_productos" id="contenedorDeProductos">
            <!--Resultados de la busqueda-->
        </section>
        
    </article>

    <script type="module" src="js/index_admin_app.js"></script>

</body>
</html>
